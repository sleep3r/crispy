name: "lint"
on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The repo has no bun lockfile, so --frozen-lockfile (used previously) always
      # failed. Plain `bun install` matches the build workflow.
      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Unit tests
        run: bun run test

  # transcribe-cpp and transcribe-rs's "whisper-cpp" feature each vendor their own
  # ggml (0.20.2 vs 0.9.5) and export the same symbols. Their cargo `links` keys
  # differ, so cargo will happily accept both: the C++ compiles, the binary links,
  # the app launches and enumerates devices — and then ~46 of ~100 GGML_OP ordinals
  # mean different operations at inference, because GGML_OP_COL2IM_1D is inserted
  # mid-enum. Nothing in the compiler or linker ever complains, so this grep is the
  # only automated defence.
  no-duplicate-ggml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert whisper-rs-sys is absent from the lockfile
        run: |
          if grep -q '^name = "whisper-rs-sys"' Cargo.lock; then
            echo "::error file=src-tauri/Cargo.toml::whisper-rs-sys is back in Cargo.lock."
            echo "It vendors ggml 0.9.5, which silently corrupts transcribe-cpp's graph"
            echo "dispatch. Remove the transcribe-rs \"whisper-cpp\" feature."
            exit 1
          fi
          echo "ok: single ggml in the dependency graph"
